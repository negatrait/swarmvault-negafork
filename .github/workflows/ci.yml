env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.24'
          cache-dependency-path: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6.2.0
        with:
          version: v1.64.6
      - run: |
          mkdir -p bin
          USE_GO_PORT=true CGO_ENABLED=0 go build -o bin/swarmvault-native ./cmd/swarmvault-native
      - run: pnpm test
      - run: SWARMVAULT_BIN_PATH=$(pwd)/bin USE_GO_PORT=true pnpm test

  perf-budget:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.24'
          cache-dependency-path: go.mod
      - run: pnpm build
      - run: pnpm check:perf
      - run: USE_GO_PORT=true pnpm check:perf

  packaged-smoke:
    runs-on: ubuntu-22.04
    needs: check
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.0.0
      - uses: actions/setup-node@v4.1.0
        with:
          node-version: "22"
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5.2.0
        with:
          go-version: '1.24'
          cache-dependency-path: go.mod
      - run: pnpm release:preflight -- --skip-check --skip-test --skip-web --skip-skill --no-browser --no-oss-corpus

      - name: Upload packaged smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v4.6.0
        with:
          name: packaged-smoke-artifacts
          path: |
            .live-smoke-artifacts/
            .oss-corpus-artifacts/
          if-no-files-found: ignore
