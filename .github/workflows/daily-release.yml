env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
name: Daily Release


on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - staging

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: go.mod

      - name: Build Go binaries
        run: |
          mkdir -p dist
          USE_GO_PORT=true CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/swarmvault-native-linux-amd64 ./cmd/swarmvault-native
          USE_GO_PORT=true CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/swarmvault-native-linux-arm64 ./cmd/swarmvault-native

      - name: Create Daily Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily
          name: Daily Release
          prerelease: true
          files: |
            dist/swarmvault-native-linux-amd64
            dist/swarmvault-native-linux-arm64
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
